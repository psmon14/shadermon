name: AppImage Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, like v1.2.3"
        required: false
        type: string

permissions:
  contents: write

jobs:
  ubuntu-build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            libgtk-3-dev
            libglib2.0-dev
            libgirepository1.0-dev
            libxdo-dev
            libfuse2
            pkg-config
            build-essential
            wget
            file

      - name: Install system dependencies
        run: |
          sudo add-apt-repository universe -y || true
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            libxdo-dev \
            libfuse2 || sudo apt-get install -y libfuse2t64 \
            pkg-config \
            build-essential \
            wget \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
          
      - name: Install cargo-appimage
        run: cargo install cargo-appimage

      - name: Download appimagetool
        run: |
          ARCH=x86_64
          wget -O appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Link icon into crate root
        run: ln -sf assets/icon.png icon.png

      - name: Build AppImage
        run: cargo appimage

      - name: Find AppImage
        id: find_appimage_ubuntu
        run: |
          APPIMAGE=$(find target/appimage -name '*.AppImage' -type f | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found in target/appimage"
            find target -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"

      - name: Rename AppImage for Ubuntu
        id: rename_ubuntu
        run: |
          ARCH=x86_64
          NEW_NAME="Steam_Shader_Monitor-${ARCH}-Ubuntu.AppImage"
          mv "${{ steps.find_appimage_ubuntu.outputs.appimage }}" "target/appimage/${NEW_NAME}"
          echo "renamed_appimage=target/appimage/${NEW_NAME}" >> "$GITHUB_OUTPUT"

      - name: Make AppImage executable
        run: chmod +x "${{ steps.rename_ubuntu.outputs.renamed_appimage }}"

      - name: Upload Ubuntu AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Steam_Shader_Monitor-x86_64-Ubuntu
          path: ${{ steps.rename_ubuntu.outputs.renamed_appimage }}

  arch-build-and-release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            pacman-${{ runner.os }}-

      - name: Install system dependencies (Arch)
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel \
            rust \
            git \
            wget \
            pkgconf \
            xdotool \
            gtk3 \
            glib2 \

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install cargo-appimage
        run: cargo install cargo-appimage

      - name: Download appimagetool
        run: |
          ARCH=x86_64
          wget -O appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool
          mv appimagetool /usr/local/bin/appimagetool

      - name: Link icon into crate root
        run: ln -sf assets/icon.png icon.png

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          cargo appimage

      - name: Find AppImage
        id: find_appimage_arch
        run: |
          APPIMAGE=$(find target/appimage -name '*.AppImage' -type f | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found in target/appimage"
            find target -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"

      - name: Rename AppImage for Arch
        id: rename_arch
        run: |
          ARCH=x86_64
          NEW_NAME="Steam_Shader_Monitor-${ARCH}-Arch.AppImage"
          mv "${{ steps.find_appimage_arch.outputs.appimage }}" "target/appimage/${NEW_NAME}"
          echo "renamed_appimage=target/appimage/${NEW_NAME}" >> "$GITHUB_OUTPUT"

      - name: Make AppImage executable
        run: chmod +x "${{ steps.rename_arch.outputs.renamed_appimage }}"

      - name: Upload Arch AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Steam_Shader_Monitor-x86_64-Arch
          path: ${{ steps.rename_arch.outputs.renamed_appimage }}

  create-release:
    needs:
      - ubuntu-build-and-release
      - arch-build-and-release
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        if: startsWith(github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: |
            dist/Steam_Shader_Monitor-x86_64-Ubuntu/Steam_Shader_Monitor-x86_64-Ubuntu.AppImage
            dist/Steam_Shader_Monitor-x86_64-Arch/Steam_Shader_Monitor-x86_64-Arch.AppImage
